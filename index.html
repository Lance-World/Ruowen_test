<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruowen Knowledge Map</title>
  <link rel="stylesheet" href="./css/style.css?v=mobile_bottom_sheet_20260505" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <button id="searchToggleBtn" class="search-toggle" title="搜尋 / 收合搜尋" aria-label="搜尋 / 收合搜尋">🔍</button>
      <button id="sidebarToggleBtn" class="sidebar-toggle" title="收合 / 展開側邊欄" aria-label="收合 / 展開側邊欄">☰</button>

      <div class="logo">✦</div>

      <div class="sidebar-title">
        <strong>Ruowen</strong>
        <span>Knowledge Map</span>
      </div>

      <div id="sidebarSearchPanel" class="sidebar-search-panel search-collapsed">
        <div class="sidebar-search-wrap">
          <button
            type="button"
            id="searchBtn"
            class="sidebar-search-submit-btn"
            title="搜尋"
            aria-label="搜尋"
          >🔍</button>
          <input
            id="searchInput"
            class="sidebar-search"
            type="text"
            placeholder="搜尋概念、詞彙、句子，並追溯 MD 來源與 YouTube 時間戳"
            autocomplete="off"
          />
          <button
            type="button"
            id="clearSearchBtn"
            class="sidebar-clear-btn hidden"
            title="清除搜尋"
            aria-label="清除搜尋"
          >×</button>
        </div>
      </div>

      <div class="sidebar-section filter-section">
        <label class="sidebar-label">顯示類型</label>
        <div class="filter-chip-row">
          <button class="side-item active filter-chip" data-type="all">全部</button>
          <button class="side-item active filter-chip" data-type="topic">主題</button>
          <button class="side-item active filter-chip" data-type="concept">概念</button>
        </div>
      </div>

      <button
        type="button"
        id="categoryToggleBtn"
        class="category-toggle-btn"
        aria-expanded="false"
      >主題分類</button>

      <div class="sidebar-section sidebar-category-section" id="sidebarCategorySection">
        <label class="sidebar-label">主題分類</label>
        <div id="categoryChips" class="sidebar-category-list"></div>
      </div>
    </aside>

    <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="拖曳調整側邊欄寬度"></div>

    <main class="main-area">
      <section id="workspace" class="workspace">
        <section class="graph-section">
          <div class="graph-card">
            <div class="floating-actions">
              <button type="button" id="resetViewBtn">重置視角</button>
              <button type="button" id="expandAllBtn">顯示全部</button>
              <button type="button" id="clearSelectionBtn">清除選取</button>
            </div>

            <svg id="graphSvg"></svg>

            <div class="floating-note">
              <strong>操作提示</strong>
              <span>點選節點：查看資訊</span>
              <span>雙擊節點：聚焦放大</span>
              <span>滾輪：縮放</span>
            </div>

            <div id="emptyState" class="empty-state hidden">找不到符合條件的節點</div>
          </div>
        </section>

        <div id="mainResizeHandle" class="resize-handle horizontal"></div>

        <section id="infoPanel" class="info-panel">
         <div class="info-header info-header-row">
            <div class="info-icon" title="點擊收合/展開卡片">✦</div>
          
            <div class="info-title-block">
              <h2 id="infoTitle">
                <span class="info-title-text">尚未選擇節點</span>
              </h2>
            </div>
          
            <div id="infoTags" class="info-tags">
              <span>請點選圖上的節點</span>
            </div>
          
            <div class="info-related-row">
              <h3>相關詞彙</h3>
              <div id="relatedTerms" class="inline-pill-list">
                <span class="muted">尚無資料</span>
              </div>
            </div>
          </div>

          <div class="info-split-area">
            <div id="sentencePanel" class="info-box sentence-box">
              <h3>相關句子參考</h3>
              <div id="relatedPhrases" class="quote-list">
                <span class="muted">尚無資料</span>
              </div>
            </div>

            <div id="innerResizeHandle" class="resize-handle vertical"></div>

            <div id="sourcePanel" class="info-box source-box">
              <h3>相關出處</h3>
              <div id="sourceList" class="source-list">
                <span class="muted">尚無資料</span>
              </div>
            </div>
          </div>
          <div id="infoRightResizeHandle" class="resize-handle info-right" title="拖曳調整資訊欄寬度 / 手機高度"></div>
        </section>
      </section>
    </main>
  </div>


  <div id="introOverlay" class="intro-overlay" aria-hidden="false">
    <div class="intro-glass">
      <div class="intro-message-wrap">
        <span class="intro-star intro-star-top intro-star-top-a">✦</span>
        <span class="intro-star intro-star-top intro-star-top-b">✧</span>
        <span class="intro-star intro-star-bottom">✦</span>
        <div id="introMessageText" class="intro-message-text">慢慢靠近自己</div>
      </div>
      <button type="button" id="introSkipBtn" class="intro-skip-btn">跳過</button>
      <div class="meteor meteor-one"></div>
      <div class="meteor meteor-two"></div>
      <div class="meteor meteor-three"></div>
    </div>
  </div>

  <script src="./app.js?v=mobile_bottom_sheet_20260505"></script>
</body>
</html>
